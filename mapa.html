<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa del recorrido</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body, #map { height:100%; width:100%; min-height:100dvh; }
html { height:-webkit-fill-available; }
body { min-height:100dvh; min-height:-webkit-fill-available; }
#map { cursor: crosshair; }
#modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:9999; align-items:center; justify-content:center; }
#modal-overlay.show { display:flex; }
#modal-box { background:#fff; border-radius:8px; padding:20px 24px; min-width:300px; box-shadow:0 4px 20px rgba(0,0,0,0.3); font-family:sans-serif; }
#modal-box h3 { margin:0 0 12px; font-size:16px; color:#1a1a2e; }
#modal-box input { width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:4px; font-size:14px; outline:none; }
#modal-box input:focus { border-color:#1565C0; }
#modal-buttons { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
#modal-buttons button { padding:6px 18px; border:none; border-radius:4px; font-size:13px; cursor:pointer; }
#modal-buttons .ok { background:#1565C0; color:#fff; }
#modal-buttons .ok:hover { background:#0d47a1; }
#modal-buttons .cancel { background:#e0e0e0; color:#333; }
#modal-buttons .cancel:hover { background:#bdbdbd; }
#track-controls { position:absolute; top:10px; left:50px; z-index:1000; background:rgba(255,255,255,0.95); padding:5px 10px; border-radius:4px; box-shadow:0 1px 5px rgba(0,0,0,0.3); display:flex; align-items:center; gap:6px; font-family:sans-serif; font-size:12px; }
#track-controls label { font-weight:600; color:#333; }
#track-color { width:28px; height:24px; border:none; padding:0; cursor:pointer; }
#track-width { width:80px; cursor:pointer; }
#track-width-val { min-width:16px; text-align:center; color:#333; font-weight:600; }
#profile-panel { position:absolute; z-index:1000; background:rgba(255,255,255,0.95); border-radius:4px; box-shadow:0 1px 5px rgba(0,0,0,0.3); padding:4px; font-family:sans-serif; font-size:11px; }
#profile-panel canvas { display:block; border:1px solid #ccc; border-radius:2px; }
#profile-close { position:absolute; top:1px; right:1px; width:22px; height:22px; border:none; background:rgba(255,255,255,0.9); color:#666; font-size:13px; line-height:1; cursor:pointer; border-radius:3px; z-index:5; }
#profile-close:hover { background:#e53935; color:#fff; }
#profile-reopen { position:absolute; bottom:24px; right:24px; z-index:1000; display:none; padding:10px 18px; font-size:15px; font-family:sans-serif; font-weight:600; color:#1565C0; background:#fff; border:2px solid #1565C0; border-radius:24px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.3); }
#profile-reopen:hover { background:#1565C0; color:#fff; }
#poi-buttons { display:flex; flex-direction:column; gap:6px; align-items:stretch; background:transparent; border:none; box-shadow:none; pointer-events:auto; }
.poi-btn { padding:6px 14px; border-radius:4px; cursor:pointer; font-size:13px; font-family:sans-serif; white-space:nowrap; text-align:center; box-shadow:0 1px 5px rgba(0,0,0,0.3); }
#btn-poi { border:1px solid #1565C0; background:#1565C0; color:#fff; }
#btn-poi:hover { background:#0d47a1; }
#btn-poi.loading { cursor: wait; }
#btn-poi .hourglass { display:inline-block; animation: hourglass 2s linear infinite; }
@keyframes hourglass { 0% { transform:rotate(0); } 50% { transform:rotate(180deg); } 100% { transform:rotate(360deg); } }
#btn-add-pois { border:1px solid #E65100; background:#E65100; color:#fff; }
#btn-add-pois:hover { background:#bf360c; }
#export-controls { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; gap:6px; background:rgba(255,255,255,0.95); padding:5px 6px; border-radius:4px; box-shadow:0 1px 5px rgba(0,0,0,0.3); font-family:sans-serif; font-size:12px; align-items:center; }
#export-controls span { color:#333; font-weight:600; white-space:nowrap; }
#export-controls button { border:none; border-radius:3px; padding:6px 14px; font-size:13px; font-family:sans-serif; cursor:pointer; background:#1565C0; color:#fff; }
#export-controls button:hover { background:#0d47a1; }

@media (max-width: 480px) {
  #track-controls { left:8px; right:8px; flex-wrap:wrap; gap:4px; font-size:11px; padding:4px 8px; top:8px; }
  #track-width { width:50px; }
  .poi-btn { font-size:11px; padding:4px 10px; }
  #profile-panel { max-width:calc(100vw - 10px); }
  #profile-panel canvas { max-width:100%; height:auto; }
  #modal-box { min-width:unset; width:92vw; padding:16px; }
}
</style>
</head>
<body>
<div id="map"></div>
<div id="track-controls"><label>Track:</label><input id="track-color" type="color" value="#1565C0"><input id="track-width" type="range" min="1" max="10" value="3"><span id="track-width-val">3</span></div>
<div id="export-controls"><span>Exportar:</span><button id="btn-export-png">PNG</button><button id="btn-export-jpg">JPG</button></div>
<div id="profile-panel"><button id="profile-close" title="Ocultar perfil">✕</button><canvas id="profile-canvas"></canvas></div>
<button id="profile-reopen" title="Mostrar perfil">📈 Perfil</button>
<div id="modal-overlay"><div id="modal-box"><h3 id="modal-title">Nuevo Waypoint</h3><input id="modal-input" type="text"><div id="modal-buttons"><button class="ok" id="modal-ok">OK</button><button class="cancel" id="modal-cancel">Cancelar</button></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-image@0.4.0/leaflet-image.js"></script>
<script src="mapa.js"></script>
</body>
</html>
